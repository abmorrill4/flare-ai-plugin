<p class=MsoNormal><o:p>&nbsp;</o:p></p>
<p class=MsoNormal>We never say log in. Always say sign in when we mean<span style='mso-spacerun:yes'>  </span>entering
credentials.<o:p></o:p></p>
<p class=MsoNormal><o:p>&nbsp;</o:p></p>
<p class=MsoNormal>Write e-mail as <span class=SpellE>email</span> everywhere.<o:p></o:p></p>
<p class=MsoNormal><o:p>&nbsp;</o:p></p>
<p class=MsoNormal>Don&#8217;t promise dates, prices or availability in the
docs.<o:p></o:p></p>
<p class=MsoNormal><o:p>&nbsp;</o:p></p>
<p class=MsoNormal>Prefer select over click for menu items.<o:p></o:p></p>
