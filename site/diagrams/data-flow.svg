<svg xmlns="http://www.w3.org/2000/svg" class="hsf" viewBox="0 0 360 548" width="360" height="548" role="img" aria-labelledby="data-flow-title data-flow-desc" style="width:100%;max-width:520px;height:auto;display:block">
  <title id="data-flow-title">What stays on your computer and what is sent</title>
  <desc id="data-flow-desc">Topics, the style guide, the linter, the encrypted API key and the diagnostic log all stay on the writer's computer. Only when the writer asks for an AI action, the paragraphs being checked and the relevant rules are sent to the Anthropic API or the company gateway. House Style sends no telemetry.</desc>
  <style>
    .hsf { --i: var(--text, #1b2326); --m: var(--text-muted, #4a5559); --b: var(--border, #d5dcde); --p: var(--surface, #ffffff); --z: var(--bg-alt, #f4f6f7); --a: var(--accent, #0b5e6b); --at: var(--accent-text, #ffffff); --nb: var(--note-bg, #fff7e6); --nl: var(--note-border, #b7791f); }
    @media (prefers-color-scheme: dark) { .hsf { --i: var(--text, #e6ecee); --m: var(--text-muted, #b3c0c4); --b: var(--border, #33444a); --p: var(--surface, #1b262a); --z: var(--bg-alt, #172024); --a: var(--accent, #5fc4d2); --at: var(--accent-text, #0b1a1d); --nb: var(--note-bg, #2a2416); --nl: var(--note-border, #d9a441); } }
    .hsf text { stroke: none; font-family: var(--font, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif); fill: var(--i); }
    .hsf .eb { font-family: var(--mono, ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace); font-size: 10px; letter-spacing: 0.06em; fill: var(--m); }
    .hsf .nm { font-size: 13px; font-weight: 600; }
    .hsf .sb { font-size: 11px; fill: var(--m); }
    .hsf .al { font-family: var(--mono, ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace); font-size: 10px; letter-spacing: 0.04em; fill: var(--m); }
    .hsf .zl { fill: var(--z); stroke: var(--b); stroke-width: 1; }
    .hsf .zn { fill: var(--nb); stroke: var(--nl); stroke-width: 1; stroke-dasharray: 5 4; }
    .hsf .nd { fill: var(--p); stroke: var(--i); stroke-width: 1; }
    .hsf .nopt { fill: var(--p); stroke: var(--nl); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .hsf .nf { fill: var(--a); stroke: var(--a); stroke-width: 1; }
    .hsf .nf text { fill: var(--at); }
    .hsf .bd { fill: none; stroke: var(--m); stroke-width: 1.25; }
    .hsf .bn { fill: none; stroke: var(--nl); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .hsf .bg { fill: var(--i); } .hsf .bgt { fill: var(--p); font-size: 10px; font-weight: 700; text-anchor: middle; }
    .hsf .mk { fill: var(--p); }
    .hsf .mkn { fill: var(--nb); }
    .hsf .ar { fill: var(--m); } .hsf .arn { fill: var(--nl); }
  </style>
  <defs>
    <marker id="data-flow-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" class="ar"/></marker>
    <marker id="data-flow-ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" class="arn"/></marker>
  </defs>

  <!-- zones -->
  <rect class="zl" x="12" y="12" width="336" height="252" rx="6"/>
  <rect class="zn" x="12" y="264" width="336" height="200"/>
  <text class="eb" x="24" y="30">STAYS ON YOUR COMPUTER</text>
  <text class="eb" x="24" y="282">LEAVES YOUR COMPUTER</text>

  <!-- arrows -->
  <line class="bn" x1="280" y1="248" x2="280" y2="296" marker-end="url(#data-flow-ahn)"/>
  <line class="bn" x1="100" y1="368" x2="100" y2="396" marker-end="url(#data-flow-ahn)"/>
  <line class="bn" x1="260" y1="368" x2="260" y2="396" marker-end="url(#data-flow-ahn)"/>
  <rect class="mkn" x="196" y="264" width="76" height="16"/>
  <text class="al" x="200" y="276">ON REQUEST</text>

  <!-- local -->
  <rect class="nd" x="24" y="44" width="152" height="52" rx="6"/>
  <text class="nm" x="36" y="64">Your topics</text>
  <text class="sb" x="36" y="80">Flare project files</text>
  <rect class="nd" x="184" y="44" width="152" height="52" rx="6"/>
  <text class="nm" x="196" y="64">Style guides</text>
  <text class="sb" x="196" y="80">Google + your team's</text>
  <rect class="nd" x="24" y="120" width="152" height="52" rx="6"/>
  <text class="nm" x="36" y="140">Your API key</text>
  <text class="sb" x="36" y="156">Encrypted with DPAPI</text>
  <rect class="nd" x="184" y="120" width="152" height="52" rx="6"/>
  <text class="nm" x="196" y="140">Diagnostic log</text>
  <text class="sb" x="196" y="156">Timings, no text or key</text>
  <rect class="nd" x="24" y="196" width="312" height="52" rx="6"/>
  <text class="nm" x="36" y="216">Linter and plugin</text>
  <text class="sb" x="36" y="232">Style checks run here: free, instant</text>

  <!-- sent -->
  <rect class="nopt" x="24" y="296" width="312" height="72" rx="6"/>
  <text class="nm" x="36" y="316">What is sent</text>
  <text class="sb" x="36" y="332">The paragraphs being checked</text>
  <text class="sb" x="36" y="346">+ the style rules that apply</text>
  <text class="sb" x="36" y="360">(alt text: the image)</text>
  <rect class="nd" x="24" y="396" width="152" height="52" rx="6"/>
  <text class="nm" x="36" y="416">Anthropic API</text>
  <text class="sb" x="36" y="432">Under your own key</text>
  <rect class="nd" x="184" y="396" width="152" height="52" rx="6"/>
  <text class="nm" x="196" y="416">Company gateway</text>
  <text class="sb" x="196" y="432">The one you configured</text>

  <!-- telemetry -->
  <g class="nf">
    <rect x="12" y="480" width="336" height="52" rx="6"/>
    <text class="nm" x="24" y="500">No telemetry</text>
    <text class="sb" x="24" y="516" style="fill:var(--at)">Nothing is sent to the authors</text>
  </g>
</svg>
