        <h1>About transfers</h1>
        <p>A transfer moves money between your own accounts. In order to move money to someone else, see Send money to a friend.</p>
        <p>Transfers that you schedule are sent at 9 AM. You can utilize the calendar to pick a day.</p>
        <p>Please note that a transfer can't be undone after it is sent.</p>
    </body>
