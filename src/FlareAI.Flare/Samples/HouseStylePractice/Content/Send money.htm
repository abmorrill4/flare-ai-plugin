<html xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.xsd">
    <head>
        <title>Send money to a friend</title>
    </head>
    <body>
        <h1>Send Money To A Friend</h1>
        <p>In order to send money, open the Transfers page.</p>
        <p>Please note that you can utilize your contact list to pick a friend.</p>
        <ol>
            <li>Click on <b>Send</b>.</li>
            <li>Enter the amount, e.g. 25 dollars.</li>
            <li>Simply click <b>Confirm</b>.</li>
        </ol>
        <p>The money arrives in 1-2 business days. Click here to see the fees.</p>
    </body>
</html>
