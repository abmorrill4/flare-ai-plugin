    <head>
        <title>Remove a message</title>
    </head>
    <body>
        <h1>Remove a message</h1>
        <p>You can remove a message at any time.</p>
        <p><img src="../Resources/Images/messages.png" /></p>
        <ol><li>On the main menu, select <b>Messages</b>.</li><li>Find the message, and then select <b>Remove</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The message list shows the change right away.</p>
        <p><img src="../Resources/Images/messages.png" alt="The Messages page with the Remove button." /></p>
    </body>
</html>
