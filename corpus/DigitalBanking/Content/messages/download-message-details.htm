        <h1>Download message details</h1>
        <p>You can download a message at any time.</p>
        <ol><li>On the main menu, select <b>Messages</b>.</li><li>Find the message, and then select <b>Download</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The message list shows the change right away. For the fee schedule, <a href="https://www.example.com/fees">click here</a>.</p>
