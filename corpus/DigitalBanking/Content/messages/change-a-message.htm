        <title>Change a message</title>
    </head>
    <body>
        <h1>Change a message</h1>
        <p>You can change a message at any time.</p>
        <ol><li>On the main menu, select <b>Messages</b>.</li><li>Find the message, and then select <b>Edit</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The message list shows the change right away. For help, call 1-800-555-0100.</p>
    </body>
</html>
