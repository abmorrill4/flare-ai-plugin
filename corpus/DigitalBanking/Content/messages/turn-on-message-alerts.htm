    <body>
        <h1>Turn on message alerts</h1>
        <p>You can turn on alerts for a message at any time.</p>
        <ol><li>On the main menu, select <b>Messages</b>.</li><li>Find the message, and then select <b>Alerts</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The message list shows the change right away.</p>
        <p><img src="../Resources/Images/messages.png" alt="The Messages page with the Alerts button." /></p>
        <table><tr><td>Limit</td><td>Amount</td></tr><tr><td>Daily</td><td>$2,500</td></tr></table>
    </body>
</html>
