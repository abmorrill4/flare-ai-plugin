        <h1>Sign-in and security settings</h1>
        <p>These settings control how each trusted device works.</p>
        <table><thead><tr><th>Setting</th><th>What it does</th></tr></thead><tbody><tr><td>Remember device</td><td>Skips the extra check on a trusted device.</td></tr><tr><td>Session timeout</td><td>Signs a member out after a period of inactivity.</td></tr></tbody></table>
        <p>Staff can change the defaults on the <b>Settings</b> page.</p>
    </body>
