        <title>Download trusted device details</title>
    </head>
    <body>
        <h1>Download trusted device details</h1>
        <p>You can download a trusted device at any time.</p>
        <ol><li>On the main menu, select <b>Security</b>.</li><li>Find the trusted device, and then select <b>Download</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The trusted device list shows the change right away.</p>
    </body>
</html>
