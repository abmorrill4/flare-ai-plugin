        <title>Change a trusted device</title>
    </head>
    <body>
        <h1>Change a trusted device</h1>
        <p>You can change a trusted device at any time.</p>
        <ol><li>On the main menu, select <b>Security</b>.</li><li>Find the trusted device, and then select <b>Edit</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The trusted device list shows the change right away.</p>
    </body>
</html>
