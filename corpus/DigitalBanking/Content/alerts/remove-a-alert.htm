        <title>Remove an alert</title>
    </head>
    <body>
        <h1>Remove an alert</h1>
        <p>You can remove an alert at any time. Click the save button to keep your changes.</p>
        <ol><li>On the main menu, select <b>Alerts</b>.</li><li>Find the alert, and then select <b>Remove</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The alert list shows the change right away.</p>
        <p><img src="../Resources/Images/alerts.png" alt="The Alerts page with the Remove button." /></p>
    </body>
</html>
