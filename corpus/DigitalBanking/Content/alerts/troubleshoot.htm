    <body>
        <h1>Troubleshoot alerts</h1>
        <p>Try these steps when an alert doesn't look right.</p>
        <h2>An alert is missing</h2>
        <p>Refresh the page. If the alert still doesn't appear, sign out and sign in again.</p>
        <h2>A change didn't save</h2>
        <p>Check that every required box has a value, and then select <b>Save</b> again. For help, call 1-800-555-0100.</p>
        <MadCap:snippetBlock src="../Resources/Snippets/SupportContact.flsnp" />
