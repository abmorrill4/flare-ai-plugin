    <body>
        <h1>Add an alert</h1>
        <p>You can add an alert at any time.</p>
        <ol><li>On the main menu, select <b>Alerts</b>.</li><li>Find the alert, and then select <b>Add</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The alert list shows the change right away.</p>
        <p><img src="../Resources/Images/alerts.png" alt="The Alerts page with the Add button." /></p>
        <table><tr><td>Limit</td><td>Amount</td></tr><tr><td>Daily</td><td>$2,500</td></tr></table>
