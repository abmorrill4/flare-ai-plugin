        <h1>Bill pay questions</h1>
        <h2>How long does a payee take?</h2>
        <p>Most changes to a payee appear within a few minutes.</p>
        <h2>Who can see a payee?</h2>
        <p>Only the account owner and the people they share access with can see payees. If the user deletes the payee, it can't be restored. Contact your bank if a payee is missing.</p>
