        <title>Remove a wire</title>
    </head>
    <body>
        <h1>Remove a wire</h1>
        <p>You can remove a wire at any time.</p>
        <ol><li>On the main menu, select <b>Wires</b>.</li><li>Find the wire, and then select <b>Remove</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>. Shared wire access is coming soon.</li></ol>
        <p>The wire list shows the change right away. Your new wire is ready to go!</p>
    </body>
</html>
