    <body>
        <h1>Change a savings goal</h1>
        <p>You can change a savings goal at any time.</p>
        <p><img src="../Resources/Images/savings.png" /></p>
        <ol><li>On the main menu, select <b>Goals</b>.</li><li>Find the savings goal, and then select <b>Edit</b>. For help, call 1-800-555-0100.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The savings goal list shows the change right away.</p>
    </body>
</html>
