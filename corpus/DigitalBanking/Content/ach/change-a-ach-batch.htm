        <title>Change an ACH batch</title>
    </head>
    <body>
        <h1>Change an ACH batch</h1>
        <p>You can change an ACH batch at any time.</p>
        <ol><li>On the main menu, select <b>ACH</b>.</li><li>Find the ACH batch, and then select <b>Edit</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The ACH batch list shows the change right away.</p>
    </body>
</html>
