        <h1>Review account nickname history</h1>
        <p>You can review an account nickname at any time.</p>
        <ol><li>On the main menu, select <b>Accounts</b>.</li><li>Find the account nickname, and then select <b>History</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The account nickname list shows the change right away.</p>
        <p><img src="../Resources/Images/accounts.png" alt="The Accounts page with the History button." /></p>
