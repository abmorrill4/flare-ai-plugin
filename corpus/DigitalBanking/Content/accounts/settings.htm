        <h1>Account overview settings</h1>
        <p>These settings control how each account nickname works.</p>
        <table><thead><tr><th>Setting</th><th>What it does</th></tr></thead><tbody><tr><td>Display order</td><td>Sets the order of accounts on the dashboard.</td></tr><tr><td>Hidden accounts</td><td>Hides closed or unused accounts from the dashboard.</td></tr></tbody></table>
        <p>Staff can change the defaults on the <b>Settings</b> page.</p>
