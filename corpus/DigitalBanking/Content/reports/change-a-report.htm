        <h1>Change a report</h1>
        <p>You can change a report at any time.</p>
        <ol><li>On the main menu, select <b>Reports</b>.</li><li>Find the report, and then select <b>Edit</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The report list shows the change right away.</p>
