        <h1>About reports</h1>
        <p>Reports gives members one place to manage each report in <MadCap:variable name="General.ProductName" />.</p>
        <p><img src="../Resources/Images/reports.png" /></p>
        <p>Members can add, change, and remove a report from the <b>Reports</b> page. Each change appears in the account history.</p>
        <p>Staff at <MadCap:variable name="General.CompanyName" /> choose which of these features members see.</p>
