        <title>Remove a report</title>
    </head>
    <body>
        <h1>Remove a report</h1>
        <p>You can remove a report at any time.</p>
        <ol><li>On the main menu, select <b>Reports</b>. Click the save button to keep your changes.</li><li>Find the report, and then select <b>Remove</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The report list shows the change right away.</p>
        <p><img src="../Resources/Images/reports.png" alt="The Reports page with the Remove button." /></p>
    </body>
</html>
