        <title>Download card lock details</title>
    </head>
    <body>
        <h1>Download card lock details</h1>
        <p>You can download a card lock at any time.</p>
        <ol><li>On the main menu, select <b>Cards</b>.</li><li>Find the card lock, and then select <b>Download</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The card lock list shows the change right away.</p>
    </body>
</html>
