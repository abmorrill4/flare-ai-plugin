    <head>
        <title>Remove a card lock</title>
    </head>
    <body>
        <h1>Remove a card lock</h1>
        <p>You can remove a card lock at any time.</p>
        <ol><li>On the main menu, select <b>Cards</b>.</li><li>Find the card lock, and then select <b>Remove</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The card lock list shows the change right away.</p>
    </body>
</html>
