        <h1>Card controls questions</h1>
        <h2>How long does a card lock take?</h2>
        <p>Most changes to a card lock appear within a few minutes.</p>
        <h2>Who can see a card lock?</h2>
        <p>Only the account owner and the people they share access with can see card locks. Members with MFA turned on get a code for each new card lock.</p>
