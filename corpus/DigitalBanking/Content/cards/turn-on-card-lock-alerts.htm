    <body>
        <h1>Turn on card lock alerts</h1>
        <p>You can turn on alerts for a card lock at any time.</p>
        <ol><li>On the main menu, select <b>Cards</b>.</li><li>Find the card lock, and then select <b>Alerts</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The card lock list shows the change right away.</p>
        <p><img src="../Resources/Images/cards.png" alt="The Cards page with the Alerts button." /></p>
    </body>
