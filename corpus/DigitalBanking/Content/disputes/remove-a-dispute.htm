        <title>Remove a dispute</title>
    </head>
    <body>
        <h1>Remove a dispute</h1>
        <p>You can remove a dispute at any time.</p>
        <ol><li>On the main menu, select <b>Disputes</b>.</li><li>Find the dispute, and then select <b>Remove</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The dispute list shows the change right away.</p>
    </body>
</html>
