        <h1>Disputes questions</h1>
        <h2>How long does a dispute take?</h2>
        <p>Most changes to a dispute appear within a few minutes. Each dispute is reviewed by the financial institution before it is released.</p>
        <h2>Who can see a dispute?</h2>
        <p>Only the account owner and the people they share access with can see disputes.</p>
