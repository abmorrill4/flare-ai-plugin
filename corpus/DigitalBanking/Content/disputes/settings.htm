        <h1>Disputes settings</h1>
        <p>These settings control how each dispute works.</p>
        <table><thead><tr><th>Setting</th><th>What it does</th></tr></thead><tbody><tr><td>Reason</td><td>Records why a member disputes a transaction.</td></tr><tr><td>Status</td><td>Shows where the dispute is in review.</td></tr></tbody></table>
        <p>Staff can change the defaults on the <b>Settings</b> page.</p>
