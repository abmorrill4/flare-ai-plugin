    <body>
        <h1>Download sub-user details</h1>
        <p>You can download a sub-user at any time.</p>
        <p><img src="../Resources/Images/business-users.png" /></p>
        <ol><li>On the main menu, select <b>Users</b>.</li><li>Find the sub-user, and then select <b>Download</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The sub-user list shows the change right away. For the fee schedule, <a href="https://www.example.com/fees">click here</a>.</p>
