    <head>
        <title>Add a sub-user</title>
    </head>
    <body>
        <h1>Add a sub-user</h1>
        <p>You can add a sub-user at any time. Acme Online Banking lists each sub-user on the dashboard.</p>
        <p><img src="../Resources/Images/business-users.png" /></p>
        <ol><li>On the main menu, select <b>Users</b>.</li><li>Find the sub-user, and then select <b>Add</b>.</li><li>Check the details on the screen.</li><li>Select <b>Save</b>.</li></ol>
        <p>The sub-user list shows the change right away.</p>
        <p><img src="../Resources/Images/business-users.png" alt="The Users page with the Add button." /></p>
    </body>
</html>
