        <h1>Activity and comments</h1>
        <p>The <b>Activity</b> tab in the details sidebar shows a chronological log of changes to the file — uploads, edits, shares, and comments. You can leave a comment directly in this tab; comments are visible to everyone who has access to the file: <MadCap:snippetText src="../Resources/Snippets/admin-can-turn-off.flsnp"/></p>
        <p> <img src="../Resources/Images/file-menu-comments-2.png" alt="The Activity tab showing file history and a comment field."/> </p>
