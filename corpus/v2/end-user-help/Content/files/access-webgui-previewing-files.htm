        <p>Click a file name to open a preview directly in <MadCap:variable name="General.ProductName" />. Supported formats include images, plain text, PDF, and — depending on your server — office documents and audio files. If <MadCap:variable name="General.ProductName" /> cannot preview a file format, it downloads the file to your computer instead.</p>
