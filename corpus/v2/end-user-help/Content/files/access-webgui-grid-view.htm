        <h1>Grid view</h1>
        <p>The Files app defaults to a list view. Click the grid toggle button above the file list to switch to a thumbnail grid, which is useful for browsing image folders:</p>
        <p> <img src="../Resources/Images/files-page-8.png" alt="Files displayed in thumbnail grid view." /> </p>
        <p>Click the button again to return to the list view.</p>
