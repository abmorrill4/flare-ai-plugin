        <h1>Mention contacts</h1>
        <p><b>New in version 4.2:</b></p>
        <p>You can mention contacts in your message by typing @ and then selecting the contact from the list. By doing so the contact will be automatically added as a recipient.</p>
        <p class="note">Only contacts with a valid email address will be suggested.</p>
