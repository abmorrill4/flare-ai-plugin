        <h1>Personal settings</h1>
        <p>The assistant personal settings are in <span class="uicontrol">Personal settings</span> under the <span class="uicontrol">Artificial intelligence</span> section. You can disable the assistant top menu entry there, enable or disable the AI-related smart pickers, and change the name of the folder the assistant will save its output to.</p>
