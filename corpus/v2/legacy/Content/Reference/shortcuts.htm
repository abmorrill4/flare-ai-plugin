<p align="center"><u><b>Keyboard shortcuts</b></u></p>
<p>These shortcuts work on every screen.<br /><br /></p>
<table border="1" cellpadding="3" cellspacing="0" width="100%">
<tr><td><font face="Arial" size="2"><b>Keys</b></font></td><td><font face="Arial" size="2"><b>Action</b></font></td></tr>
<tr><td><font face="Arial" size="2"><kbd>Ctrl</kbd>+<kbd>N</kbd></font></td><td><font face="Arial" size="2">Create a new record</font></td></tr>
<tr><td><font face="Arial" size="2"><kbd>Ctrl</kbd>+<kbd>S</kbd></font></td><td><font face="Arial" size="2">Save</font></td></tr>
<tr><td><font face="Arial" size="2"><kbd>F5</kbd></font></td><td bgcolor="#EEEEEE"><font face="Arial" size="2">Refresh the list</font></td></tr>
<tr><td><font face="Arial" size="2"><kbd>Ctrl</kbd>+<kbd>P</kbd></font></td><td><font face="Arial" size="2">Print</font></td></tr>
<tr><td><font face="Arial" size="2"><kbd>Esc</kbd></font></td><td><font face="Arial" size="2">Close the dialog</font></td></tr>
</table>
