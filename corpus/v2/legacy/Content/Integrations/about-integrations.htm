<h1>About Integrations</h1>
<p>The Integrations module lets dispatchers work with connectors. The list below shows the tasks that you can do.</p>
<h2>Tasks</h2>
<ul>
<li>Connect a connector</li>
<li>Map fields</li>
<li>Test the connection</li>
<li>View the synchronization log</li>
<li>Disconnect a connector</li>
<li>Create an API key</li>
</ul>
