<h1>Take a photo</h1>
<p>Use the Jobs screen to manage a photo.</p>
<p>Dispatchers log in each morning and check the work orders for the day.</p>
<h2>Steps</h2>
<ol>
<li>Tap <b>Photo</b>.</li>
<li>Point the camera at the equipment and tap the shutter.</li>
</ol>
<p><img src="../Resources/Images/screen-dialog.png" /></p>
