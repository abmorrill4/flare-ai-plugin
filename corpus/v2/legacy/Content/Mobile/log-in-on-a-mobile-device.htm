<h1>Log in on a mobile device</h1>
<p>Use the Jobs screen to manage a login.</p>
<h2>Steps</h2>
<ol>
<li>Open the app and enter your user name.</li>
<li>Enter your password.</li>
<li>Tap <b>login</b>.</li>
</ol>
<p class="note"><span MadCap:conditions="Default.Print">Note: </span>Your changes are saved!</p>
<p>For help, call 1-800-555-0142.</p>
