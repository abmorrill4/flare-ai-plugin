<h1>View your jobs</h1>
<p>Use the Jobs screen to view a job.</p>
<p>Each field engineer needs a personal user name to sign in.</p>
<h2>How to do it</h2>
<ol>
<li>Tap <b>Jobs</b>.</li>
<li>Swipe left or right to change the day.</li>
</ol>
<p><img src="../Resources/Images/screen-new.png" alt="The main window" /></p>
<p>Email dispatch-support@marlowe-dispatch.example.com.</p>
<p>See also: <MadCap:xref href="synchronize-the-mobile-app.htm">Synchronize the mobile app</MadCap:xref>; <MadCap:xref href="accept-a-job.htm">Accept a job</MadCap:xref>.</p>
