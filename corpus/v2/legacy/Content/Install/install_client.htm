        <p align="center"><u><b>Install the workstation software</b></u></p>
        <p>Do these steps on every computer that dispatchers use!</p>
        <p></p>
        <p>1. Open the address of the server in your browser.<br />
2. Click Download client.<br />
3. Run the file that you downloaded.<br />
4. Type the server address when the program asks for it.</p>
        <p><a href="http://support.marlowe-dispatch.example.com/help/index.html">Click here</a> for more topics.</p>
