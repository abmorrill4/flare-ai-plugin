# Fix = delete the words (the server also takes the following space and re-capitalizes a sentence start).
extends: existence
action:
  name: remove
message: "Filler: '%s'. State the point directly."
link: https://developers.google.com/style/tone
level: warning
ignorecase: true
tokens:
  - please note that
  - note that
  - please
  - simply
  - easily
