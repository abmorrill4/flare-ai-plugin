# Publishes site/ (plain static HTML and CSS) to GitHub Pages, with the user guide built into site/guide/.
# Repo Settings > Pages > Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/user-guide/**', 'scripts/build-guide.py']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the user guide into site/guide
        run: python3 scripts/build-guide.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
