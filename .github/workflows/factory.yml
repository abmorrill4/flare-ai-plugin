# The code factory: every 30 minutes, take one new tester report from the private reports repo and either fix it
# (test, fix, retest in Flare, second-agent review, PR, merge) or hand it to the owner (feature or question).
# Scheduled and manual runs only, on the factory VM's runner. Guards: scripts/factory/README.md.
name: factory
on:
  schedule:
    - cron: '17,47 * * * *'   # off the hour and half hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
    inputs:
      issue:
        description: 'A report number to work on now (optional)'
        required: false
      dry_run:
        description: 'Do everything except push, PR, merge, label and comment'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: factory   # one factory run at a time; the e2e workflow has no group, so it never cancels these
  cancel-in-progress: false
jobs:
  factory:
    if: github.repository == 'abmorrill4/house-style'
    runs-on: [self-hosted, windows, flare]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the factory VM is ready
        shell: powershell
        run: .\scripts\factory\Test-FactoryReady.ps1   # exits 1 with the reason when the VM can't drive Flare

      - name: Work on one report
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          # The agents use the owner's subscription token when it is set, else the API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "House Style factory"
          git config user.email "factory@gethousestyle.com"
          $a = @{}
          if ($env:ISSUE) { $a.Issue = [int]$env:ISSUE }
          if ($env:DRY_RUN -eq 'true') { $a.DryRun = $true }
          & .\scripts\factory\Invoke-Factory.ps1 @a
