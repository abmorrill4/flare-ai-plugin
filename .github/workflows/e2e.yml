# Installs the plugin into real Flare on the self-hosted "flare" runner (the owner's PC) and runs tests/e2e.
# Only this repository's own branches reach that runner: a pull request from a fork never runs here, because the repo
# is public and the runner is the owner's machine.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flare-e2e   # one Flare on the machine at a time
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, flare]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the scenarios in Flare
        shell: powershell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $ai = if ($env:ANTHROPIC_API_KEY) { @() } else { @('-NoAi') }
          & .\tests\e2e\Run-FlareE2E.ps1 -Install -OutDir "$env:RUNNER_TEMP\e2e-results" @ai
          exit $LASTEXITCODE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results/
          if-no-files-found: ignore
