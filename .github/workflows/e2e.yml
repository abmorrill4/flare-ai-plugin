# Installs the plugin into real Flare on the self-hosted "flare" runner (the owner's factory VM) and runs tests/e2e.
# Triggered by pushes to this repository's branches and by hand, never by pull_request: for a pull_request event GitHub
# runs the workflow file from the PR itself, so a fork could rewrite any guard here. Pushing a branch needs write
# access (the owner, and the factory acting for the owner). A branch with an open PR shows this run on the PR too.
name: e2e

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flare-e2e   # one Flare on the machine at a time
  cancel-in-progress: false

jobs:
  e2e:
    if: github.repository == 'abmorrill4/house-style'
    runs-on: [self-hosted, windows, flare]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the scenarios in Flare
        shell: powershell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $noAi = -not $env:ANTHROPIC_API_KEY
          if ($noAi) { Write-Host "No ANTHROPIC_API_KEY: skipping the ai-* scenarios." }
          & .\tests\e2e\Run-FlareE2E.ps1 -Install -OutDir "$env:RUNNER_TEMP\e2e-results" -NoAi:$noAi
          exit $LASTEXITCODE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results/
          if-no-files-found: ignore
