# Builds and tests on every push and PR. A tag like v0.2.0 also packages the plugin, has SignPath sign it (once the
# SIGNPATH_* secrets exist), and publishes a GitHub release with HouseStyle-0.2.0.zip.
# Builds against ref\ (stubs of the Flare API), so no MadCap files are needed here.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the bench gate's PR checks diff against the base branch

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test FlareAI.sln -c Release   # Core, scenarios, rule fixtures (ratchet), scoring, corpus kit

      - name: Bench gate (lint only, offline)
        shell: pwsh
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-baseline.ps1   # vs tests/baselines/bench-lint.json; regenerate: FlareAI.Bench.exe --no-ai --update-baseline

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-lint
          path: bench-out/gate/
          if-no-files-found: ignore

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-ci' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Upload unsigned
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: HouseStyle-${{ steps.v.outputs.version }}-unsigned
          path: dist/stage/

      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: house-style
          signing-policy-slug: release-signing
          artifact-configuration-slug: plugin-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $src = if (Test-Path dist/signed) { 'dist/signed' } else { 'dist/stage' }
          $zip = "dist/HouseStyle-${{ steps.v.outputs.version }}.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path "$src/*" -DestinationPath $zip
          $note = if ($src -eq 'dist/signed') { 'Signed by SignPath Foundation.' } else { 'Unsigned build: right-click the zip > Properties > Unblock before installing.' }
          gh release create $env:GITHUB_REF_NAME $zip --title "House Style ${{ steps.v.outputs.version }}" --notes "$note`n`nInstall: see the README." --verify-tag
