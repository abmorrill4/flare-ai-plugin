# Builds and tests on every push and PR. A tag like v0.2.0 also packages the plugin, and the release job (gated by the
# "release" environment: an owner approves it) signs checksums.txt and publishes HouseStyle-0.2.0.zip, checksums.txt and
# checksums.txt.sig. Installed copies only take an update whose signature matches the key built into them.
# Builds against ref\ (stubs of the Flare API), so no MadCap files are needed here.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # only the release job writes

jobs:
  changes:
    # A PR that only touches Markdown under docs/ or at the root skips build and feedback-worker.
    # Skipped jobs still satisfy the required checks.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/.*|[^/]*)\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the bench gate's PR checks diff against the base branch
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test FlareAI.sln -c Release   # Core, scenarios, rule fixtures (ratchet), scoring, corpus kit

      - name: Guide publisher tests (mock Confluence, Windows PowerShell 5.1)
        shell: powershell
        # The tests use Pester 3.x syntax; runners also have Pester 5, which Invoke-Pester would pick by default.
        run: Import-Module Pester -MaximumVersion 3.99 -Force; Invoke-Pester tests/publish-guide -EnableExit

      - name: Bench gate (lint only, offline)
        shell: pwsh
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-baseline.ps1   # vs tests/baselines/bench-lint.json; regenerate: FlareAI.Bench.exe --no-ai --update-baseline

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-lint
          path: bench-out/gate/
          if-no-files-found: ignore

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-ci' }
          # The tag name ends up in scripts and file names: only a plain version gets through.
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Not a version tag: $env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:VERSION

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HouseStyle-${{ steps.v.outputs.version }}
          path: dist/stage/

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/HouseStyle-${{ steps.v.outputs.version }}.zip
            dist/checksums.txt
          if-no-files-found: error

    outputs:
      version: ${{ steps.v.outputs.version }}

  release:
    # Only this job can write to the repo, and only after an owner approves the "release" environment, which also holds
    # the signing key. The tagged commit must be on main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on main
        shell: pwsh
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tagged commit is not on main." }

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Sign and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $zip = "dist/HouseStyle-$env:VERSION.zip"
          # checksums.txt (sha256sum format) is made by package.ps1; the update refuses a zip whose SHA-256 doesn't match it (#101).
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content dist/checksums.txt -Raw) -notmatch "^$hash  ") { throw "checksums.txt doesn't match the zip." }
          # The signature installed copies check: RSA-SHA256 (PKCS#1 v1.5) over the exact bytes of checksums.txt.
          if (-not $env:SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set in the release environment." }
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.FromXmlString($env:SIGNING_KEY)
            $sig = $rsa.SignData([IO.File]::ReadAllBytes("dist/checksums.txt"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          } finally { $rsa.Dispose() }
          [IO.File]::WriteAllText("dist/checksums.txt.sig", [Convert]::ToBase64String($sig))
          $note = 'Right-click the zip > Properties > Unblock before you unzip it.'
          $notesFile = "docs/release-notes/$env:VERSION.md"
          $body = if (Test-Path $notesFile) { "$note`n`n" + (Get-Content $notesFile -Raw) } else { "$note`n`nInstall: see the README." }
          $body | Set-Content release-body.md -Encoding utf8
          # Draft first, then publish: releases are immutable once published, so every file goes up before that.
          gh release create $env:GITHUB_REF_NAME $zip dist/checksums.txt dist/checksums.txt.sig --title "House Style $env:VERSION" --notes-file release-body.md --verify-tag --draft
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest

  feedback-worker:
    # The Cloudflare Worker that receives in-app reports (#124). Tests only; the owner deploys it by hand (see its README).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/feedback-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/feedback-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
